name: Fast Kernel Build NetHunter - Redmi 10

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # توقف تلقائي بعد ساعة ونصف إذا علق

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set WORKDIR
      run: |
        export WORKDIR=$GITHUB_WORKSPACE/build
        mkdir -p $WORKDIR/kernel-src

    - name: Cache essential toolchain
      uses: actions/cache@v3
      with:
        path: toolchain
        key: ${{ runner.os }}-toolchain-${{ hashFiles('toolchain_version.txt') }}

    - name: Setup prebuilt toolchain
      run: |
        mkdir -p toolchain
        if [ ! -f toolchain/clang ]; then
          echo "Downloading prebuilt toolchain..."
          curl -L -o toolchain/clang.tar.gz https://example.com/toolchain.tar.gz
          tar -xzf toolchain/clang.tar.gz -C toolchain
        fi
        echo "Toolchain ready"

    - name: Clean previous build output
      run: |
        rm -rf out/
        mkdir -p out

    - name: Copy Kernel Source
      run: |
        rsync -a --exclude='.git' $GITHUB_WORKSPACE/ $WORKDIR/kernel-src/

    - name: Build Kernel Core (light logging)
      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=toolchain/aarch64-linux-gnu- -j2 V=1 2>&1 | tail -n 300 | tee build.log
      continue-on-error: false

    - name: Upload build log
      uses: actions/upload-artifact@v3
      with:
        name: build-log
        path: build.log

    - name: Upload built kernel
      uses: actions/upload-artifact@v3
      with:
        name: kernel-artifacts
        path: out/
